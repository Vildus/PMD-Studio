[workspace]
resolver = "2"
members = ["crates/pmd85-core", "crates/pmd85-app", "crates/pmd85-asm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
pmd85-core = { path = "crates/pmd85-core" }
pmd85-asm = { path = "crates/pmd85-asm" }

[profile.release]
opt-level = 3
# Smaller binary: no symbol table (panic backtraces lose names),
# cross-crate inlining, one codegen unit.
strip = true
lto = "thin"
codegen-units = 1
