[package]
name = "pmd85-app"
description = "PMD Studio — emulator and assembler IDE for the Tesla PMD 85 (wgpu renderer)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pmd85"
path = "src/main.rs"

[build-dependencies]
# Windows .exe resources (icon, version info); dormant on other targets.
winresource = "0.1"

[dependencies]
pmd85-core = { workspace = true }
pmd85-asm = { workspace = true }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "vulkan", "dx12", "metal", "wgsl"] }
winit = "0.30"
pollster = "0.3"
log = "0.4"
env_logger = { version = "0.11", default-features = false }
cpal = "0.18"
egui = "0.36"
egui-wgpu = { version = "0.36", default-features = false, features = ["winit", "x11", "wayland"] }
egui-winit = "0.36"
egui-phosphor = { version = "0.14", features = ["subset"] }
egui_dock = { version = "0.21", features = ["serde"] }
rfd = "0.15"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
# PNG decode of the embedded app icon (nothing else).
image = { version = "0.25", default-features = false, features = ["png"] }
gilrs = "0.11.2"
